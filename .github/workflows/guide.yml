name: Update guide
on:
  schedule:
    - cron: "17 */3 * * *"      # every 3 hours
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python build_guide.py channels.txt
      - name: Save the new guide
        run: |
          git config user.name "cable-guide bot"
          git config user.email "actions@users.noreply.github.com"
          git add guide.json guide-report.txt
          git commit -m "Guide update $(date -u +%Y-%m-%dT%H:%MZ)" || echo "No change"
          git push
